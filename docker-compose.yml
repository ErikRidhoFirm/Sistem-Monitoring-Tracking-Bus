services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.${APP_ENV:-production}
    environment:
      NODE_ENV: production
      PORT: 9999
      APP_INTERNAL_URL: http://127.0.0.1:9999
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buswy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.${APP_ENV:-production}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-buswy} -d $${POSTGRES_DB:-buswy}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buswy

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - buswy

volumes:
  db-data:

networks:
  buswy:
    driver: bridge
